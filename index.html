                function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    
    const selectedTab = document.getElementById(`tab-${tabId}`);
    if (selectedTab) {
        selectedTab.classList.remove('hidden');
    }
    
    
    if (tabId === 'kegiatan') {
        loadAgendaData(); 
    }
if (tabId === 'lembaga') {  // <-- Tambahan untuk memuat data lembaga
        loadLembagaData(); 
    }
    if (tabId === 'keuangan') {
        renderFinanceChart(); // <-- Panggil render chart saat tab keuangan dibuka
    }
    
    // Mobile Nav Active Style
    document.querySelectorAll('.mob-nav').forEach(btn => {
        btn.classList.remove('text-gojek-green');
        btn.classList.add('text-slate-400');
    });
    const activeMobNav = document.getElementById(`mob-${tabId}`);
    if (activeMobNav) {
        activeMobNav.classList.remove('text-slate-400');
        activeMobNav.classList.add('text-gojek-green');
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}


        // Filter Bidang Shortcut
        function filterBidang(category) {
            switchTab('bidang');
            const items = document.querySelectorAll('.bidang-item');
            items.forEach(item => {
                if (item.classList.contains(category)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Filter Kegiatan
        function filterKegiatan(status) {
            document.querySelectorAll('.keg-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
                btn.classList.add('text-slate-500');
            });
            
            const activeBtn = document.getElementById(`keg-${status}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
                activeBtn.classList.remove('text-slate-500');
            }

            const cards = document.querySelectorAll('.kegiatan-card');
            cards.forEach(card => {
                if (status === 'semua' || card.classList.contains(status)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

// Logika pergeseran otomatis foto
function initAutoSlide() {
    const slider = document.getElementById('hero-slider');
    if (!slider) return;

    let scrollIndex = 0;
    const totalSlides = slider.children.length;

    setInterval(() => {
        if (totalSlides <= 1) return;
        scrollIndex = (scrollIndex + 1) % totalSlides;
        slider.scrollTo({
            left: slider.clientWidth * scrollIndex,
            behavior: 'smooth'
        });
    }, 4000); // Bergeser otomatis setiap 4 detik
}

        // 1. Tarik data Pemasukan dan Pengeluaran secara bersamaan

            fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent("Sub Keuangan (Pemasukan)")}`),
            fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent("Sub Keuangan (Pengeluaran)")}`)

            if (val === undefined || val === null || val === '') return 0;
            let cleanStr = val.toString().trim();
            let isNegative = cleanStr.includes('-') || (cleanStr.startsWith('(') && cleanStr.endsWith(')'));
            let parsedNum = parseFloat(cleanStr.replace(/[^0-9,-]+/g, "").replace(/\./g, "").replace(/,/g, ".")) || 0;
            return isNegative && parsedNum > 0 ? -parsedNum : parsedNum;
        };

            let rowP = dataPemasukan[0];

                if (rowP.hasOwnProperty(k) && k && k.trim() !== '' && k.toLowerCase() !== 'abag') {
                    let val = parseNominal(rowP[k]);
                    pemasukanPerLembaga[k.trim()] = val;
                    totalPemasukan += val;
                }
            }
        }

        // Parse Pengeluaran
        if (dataPengeluaran && dataPengeluaran.length > 0) {

           // 2. Buat Catatan Analisis Defisit & Surplus yang Lebih Rapi & Profesional

        let countDefisit = 0;

        allLembaga.forEach(lem => {

                </div>

        }

                    <div class="flex items-center space-x-2 text-slate-800">

                    </div>

        // 3. Render Kartu Nominal & Chart Berdasarkan Toggle Aktif (Pemasukan / Pengeluaran)
        let cardHTML = '';

                        <span class="text-xs font-bold text-slate-800">${lem}</span>

                        <span class="font-extrabold text-sm sm:text-base text-slate-900">${nominalDisplay}</span>
                        ${statusMinusBadge}

            `;
        });



        // 4. Susun Tampilan Kotak Ringkasan, Saldo Akhir, & Catatan Defisit
        let labelKategori = currentKeuanganType === 'pemasukan' ? 'Total Pemasukan' : 'Total Pengeluaran';

    } catch (e) {

// Fungsi Format Rupiah Utuh Lengkap
function formatRupiahFull(angka) {
    let absVal = Math.abs(angka);
    let format = absVal.toLocaleString('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
    return angka < 0 ? '-Rp ' + format : 'Rp ' + format;
}

               <h3 class="text-sm font-bold leading-snug mb-1 line-clamp-2">${item.judul || ''}</h3>
                                    <p class="text-[11px] text-slate-300 line-clamp-2 font-normal">${item.isi || ''}</p>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`;
                container.appendChild(section);
            });
        } else {
            container.innerHTML = '';
        }
    } catch (e) {
        container.innerHTML = `<p class="text-center text-red-500 text-[10px] font-bold py-4">Gagal memuat berita.</p>`;
    }
}


// 2. Fungsi Modal Detail Berita + Tombol Kontak (WA & Link)
function openModalDetail(input) {
    let item;
    try {
        item = JSON.parse(decodeURIComponent(input));
    } catch (e) {
        return;
    }

    if (!item) return;

    const content = document.getElementById('modal-content');
    
    // Format nomor WhatsApp jika ada
    let waButton = '';
    if (item.whatsapp && item.whatsapp.toString().trim() !== '') {
        let wa = item.whatsapp.toString().replace(/\D/g, '');
        if (wa.startsWith('0')) wa = '62' + wa.slice(1);
        waButton = `
            <a href="https://wa.me/${wa}" target="_blank"
               class="flex items-center justify-center gap-2 w-full bg-emerald-600 text-white py-3 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-md active:scale-95 transition-all">
                <i class="fa-brands fa-whatsapp text-sm"></i>
                Hubungi via WhatsApp
            </a>`;
    }

    // Format Link Eksternal jika ada
    let linkButton = '';
    if (item.link && item.link.toString().trim() !== '') {
        let url = item.link.toString().trim();
        if (!url.startsWith('http')) url = 'https://' + url;
        linkButton = `
            <a href="${url}" target="_blank"
               class="flex items-center justify-center gap-2 w-full bg-slate-800 text-white py-3 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-md active:scale-95 transition-all">
                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                Buka Tautan
            </a>`;
    }

    content.innerHTML = `
        <div class="space-y-3 text-left">
            <img src="${item.foto}" class="w-full h-48 object-cover rounded-2xl mb-3" onerror="this.src='https://images.unsplash.com/photo-1590076215667-873d96c8ab13?q=80&w=500'">
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold uppercase tracking-wider bg-gojek-lightGreen text-gojek-green px-2.5 py-1 rounded-full">${item.kategori || 'Berita'}</span>
                <span class="text-[11px] text-slate-400 font-medium">${item.tanggal || ''}</span>
            </div>
            <h3 class="text-base font-bold text-slate-900 leading-snug">${item.judul || ''}</h3>
            <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${item.isi || ''}</p>
            
            ${(waButton || linkButton) ? `<div class="pt-3 space-y-2 border-t border-slate-100">${waButton}${linkButton}</div>` : ''}
        </div>
    `;

    document.getElementById('modal-backdrop').classList.remove('hidden');
}



// 3. Fungsi Helper Pencarian & Slug
function toggleSearch(category) {
    const el = document.getElementById(`search-${category}`);
    if (el) el.classList.toggle('hidden');
}

function filterCategory(category, keyword) {
    keyword = keyword.toLowerCase();
    document.querySelectorAll(`.post-card[data-category="${category}"]`).forEach(card => {
        const title = card.dataset.title || '';
        const content = card.dataset.content || '';
        const match = title.includes(keyword) || content.includes(keyword);
        card.style.display = match ? '' : 'none';
    });
}

function slugify(text) {
    return text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-');
}
        
window.addEventListener('load', () => {
    // Cek apakah ada memori perpindahan tab dari halaman lain (seperti profil)
    const savedTab = localStorage.getItem('targetTab');
    if (savedTab) {
        switchTab(savedTab);
        localStorage.removeItem('targetTab'); // Hapus setelah dipakai
    } else {
        loadBerandaData();
    }
    
    loadAgendaData();
    loadSorotanBeranda();
    loadLembagaData();
    renderFinanceChart(); 
});




// 4. Integrasi Google Sheets Agenda & Dokumentasi (Urut Berdasarkan Tanggal)
async function loadAgendaData() {
    const container = document.getElementById('kegiatan-list-container');
    if (!container) return;

    container.innerHTML = `<div class="py-10 text-center animate-pulse text-[10px] font-black text-slate-400 uppercase tracking-widest">Sinkronisasi Agenda...</div>`;

    try {
        const res = await fetch(`https://opensheet.elk.sh/${PROFIL_SHEET_ID}/Agenda`);
        const data = await res.json();
        
        if (data && data.length > 0) {
            // Mengurutkan data berdasarkan tanggal (Agenda terdekat / mendatang berada di atas)
            const sortedData = data.sort((a, b) => {
                const dateA = new Date(a.tanggal || 0);
                const dateB = new Date(b.tanggal || 0);
                return dateA - dateB; // Ubah ke (dateB - dateA) jika ingin tanggal terbaru/terakhir di paling atas
            });

            container.innerHTML = sortedData.map(item => {
                const statusVal = (item.status || '').toLowerCase();
                const isSelesai = statusVal.includes('selesai');
                const statusClass = isSelesai ? 'selesai' : 'berjalan';
                
                const statusBadge = isSelesai 
                    ? `<span class="font-bold text-emerald-600 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> Selesai</span>`
                    : `<span class="font-bold text-amber-500 flex items-center gap-1"><i class="fa-solid fa-clock"></i> Agenda Mendatang</span>`;

                return `
                <div class="kegiatan-card ${statusClass} bg-white rounded-3xl p-4 app-card-shadow border border-slate-100 space-y-3">
                    <img src="${item.foto || 'https://placehold.co/600x350/0F5132/ffffff?text=Agenda+Yayasan'}" class="w-full h-40 object-cover rounded-2xl" onerror="this.src='https://placehold.co/600x350/0F5132/ffffff?text=Agenda+Yayasan'">
                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">${item.kategori || 'Kegiatan'}</span>
                            <span class="text-[10px] text-slate-400 font-medium">${item.tanggal || ''}</span>
                        </div>
                        <h3 class="font-bold text-sm text-slate-800">${item.judul || ''}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2">${item.deskripsi || ''}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                        <span class="text-slate-400 text-[11px]">Status</span>
                        ${statusBadge}
                    </div>
                </div>`;
            }).join('');
        } else {
            container.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">Belum ada data agenda.</p>`;
        }
    } catch (e) {
        container.innerHTML = `<p class="text-center text-red-500 text-[10px] font-bold py-4">Gagal memuat agenda.</p>`;
    }
}
