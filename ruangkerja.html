<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruang Kerja Pengurus - Yayasan PENKESOMA</title>
    
    <meta name="theme-color" content="#0F5132">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#0F5132',
                            dark: '#0A3622',
                            light: '#D1E7DD'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F6F7F9;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <!-- Top App Bar / Header -->
    <header class="sticky top-0 z-40 glass-header border-b border-slate-100">
        <div class="max-w-md mx-auto md:max-w-4xl px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="yayasanannajah.html" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="font-extrabold text-sm text-slate-900 leading-tight">Ruang Kerja Pengurus</h1>
                    <p class="text-[11px] text-slate-500 font-medium">PENKESOMA ALMEY ANNAJAH</p>
                </div>
            </div>
            <span class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-bold">
                <i class="fa-solid fa-user-gear"></i>
            </span>
        </div>
    </header>

    <!-- Main Container Super App -->
    <main class="max-w-md mx-auto md:max-w-4xl px-4 pt-4 space-y-4">

        <!-- KOTAK INFORMASI / PENGUMUMAN (Diambil dari Kolom F Google Sheets) -->
        <div id="info-box-container" class="hidden bg-gradient-to-r from-emerald-800 to-emerald-900 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 text-emerald-700/30 text-7xl pointer-events-none">
                <i class="fa-solid fa-bullhorn"></i>
            </div>
            <div class="relative z-10 space-y-2">
                <div class="flex items-center space-x-2">
                    <span class="bg-emerald-700 text-emerald-100 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-circle-info"></i> Info Pengurus
                    </span>
                    <span class="text-[11px] text-emerald-200 font-medium">PENGUMUMAN RESMI</span>
                </div>
                <div id="info-content" class="text-xs text-emerald-50 leading-relaxed font-medium">
                    Memuat informasi...
                </div>
            </div>
        </div>

        <!-- TOMBOL PILIHAN / SWITCH KATEGORI (Divisi vs Lembaga) -->
        <div class="bg-white p-1.5 rounded-2xl app-card-shadow border border-slate-100 flex gap-1">
            <button id="btn-divisi" onclick="switchMode('divisi')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition bg-emerald-700 text-white shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-layer-group"></i> Berdasarkan Divisi
            </button>
            <button id="btn-lembaga" onclick="switchMode('lembaga')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-building-columns"></i> Berdasarkan Lembaga
            </button>
        </div>

        <!-- CONTAINER KARTU MENU DINAMIS -->
        <div id="dynamic-ruang-kerja-container" class="space-y-4">
            <div class="bg-white rounded-3xl p-5 app-card-shadow border border-slate-100 space-y-4">
                <div class="py-8 text-center animate-pulse text-xs text-slate-400 font-bold">
                    Menyelaraskan data menu...
                </div>
            </div>
        </div>

        <!-- Tombol Navigasi Kembali -->
        <a href="yayasanannajah.html" class="block w-full text-center py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs font-bold shadow-md transition no-underline mt-4">
            <i class="fa-solid fa-house mr-1.5"></i> Kembali ke Beranda Utama
        </a>

    </main>

    <!-- Script Logika Pengambilan Data & Kolom F -->
    <script>
        const SHEET_ID = "1krBmtuDAf26mS19F6_QX6ne5kBojnOXg2_netke742E"; 
        let globalMenuData = [];
        let currentMode = 'divisi'; // Default mode

        async function loadRuangKerjaMenu() {
            const container = document.getElementById('dynamic-ruang-kerja-container');
            const infoBox = document.getElementById('info-box-container');
            const infoContent = document.getElementById('info-content');
            if (!container) return;

            try {
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent("Tombol menu ruang kerja")}`);
                globalMenuData = await res.json();

                // Cari apakah ada baris yang mengisi kolom "Informasi Untuk Pengurus" (Kolom F)
                let infoList = [];
                if (globalMenuData && globalMenuData.length > 0) {
                    globalMenuData.forEach(item => {
                        // Memeriksa berbagai variasi penamaan properti dari header kolom F
                        let infoText = item["Informasi Untuk Pengurus"] || item["Informasi"] || item["info"] || "";
                        if (infoText && infoText.toString().trim() !== "") {
                            infoList.push(infoText.toString().trim());
                        }
                    });
                }

                // Jika ada isi di kolom F, tampilkan kotaknya di atas
                if (infoList.length > 0) {
                    infoContent.innerHTML = infoList.join("<br>• ");
                    infoBox.classList.remove('hidden'); // Munculkan kotak info
                } else {
                    infoBox.classList.add('hidden'); // Sembunyikan jika kosong
                }

                renderMenu();
            } catch (e) {
                console.error("Gagal memuat menu ruang kerja:", e);
                container.innerHTML = `<div class="bg-white rounded-3xl p-5 text-center text-xs text-red-500 py-6">Gagal menyinkronkan menu dari Google Sheets.</div>`;
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const btnDivisi = document.getElementById('btn-divisi');
            const btnLembaga = document.getElementById('btn-lembaga');

            if (mode === 'divisi') {
                btnDivisi.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition bg-emerald-700 text-white shadow-sm flex items-center justify-center gap-2";
                btnLembaga.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-2";
            } else {
                btnLembaga.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition bg-emerald-700 text-white shadow-sm flex items-center justify-center gap-2";
                btnDivisi.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold transition text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-2";
            }

            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('dynamic-ruang-kerja-container');
            if (!container) return;

            if (globalMenuData && globalMenuData.length > 0) {
                let groupedMenu = {};

                globalMenuData.forEach((item) => {
                    let namaTombol = item.Tombol ? item.Tombol.toString().trim() : '';
                    let linkUrl = item.Link ? item.Link.toString().trim() : '#';
                    let divisi = item.Divisi ? item.Divisi.toString().trim() : 'Umum';
                    let lembaga = item.Lembaga ? item.Lembaga.toString().trim() : 'Yayasan / Umum';

                    let groupKey = currentMode === 'divisi' ? divisi : lembaga;

                    if (namaTombol !== '') {
                        if (!groupedMenu[groupKey]) {
                            groupedMenu[groupKey] = [];
                        }
                        groupedMenu[groupKey].push({ 
                            nama: namaTombol, 
                            link: linkUrl, 
                            subInfo: currentMode === 'divisi' ? lembaga : divisi 
                        });
                    }
                });

                if (Object.keys(groupedMenu).length > 0) {
                    let finalHtml = '';

                    for (const [groupName, items] of Object.entries(groupedMenu)) {
                        let badgeColor = 'bg-purple-50 text-purple-600';
                        let iconClass = currentMode === 'divisi' ? 'fa-layer-group' : 'fa-building-columns';
                        let itemTheme = { bg: 'bg-slate-50', text: 'text-slate-600', hoverBg: 'hover:bg-slate-700' };

                        const lowerName = groupName.toLowerCase();
                        if (lowerName.includes('bendahara') || lowerName.includes('keuangan')) {
                            badgeColor = 'bg-emerald-50 text-emerald-600';
                            iconClass = 'fa-wallet';
                            itemTheme = { bg: 'bg-emerald-50', text: 'text-emerald-600', hoverBg: 'hover:bg-emerald-600' };
                        } else if (lowerName.includes('sekretaris') || lowerName.includes('surat')) {
                            badgeColor = 'bg-blue-50 text-blue-600';
                            iconClass = 'fa-file-pen';
                            itemTheme = { bg: 'bg-blue-50', text: 'text-blue-600', hoverBg: 'hover:bg-blue-600' };
                        } else if (lowerName.includes('humas') || lowerName.includes('media')) {
                            badgeColor = 'bg-amber-50 text-amber-600';
                            iconClass = 'fa-bullhorn';
                            itemTheme = { bg: 'bg-amber-50', text: 'text-amber-600', hoverBg: 'hover:bg-amber-600' };
                        } else if (lowerName.includes('ketua')) {
                            badgeColor = 'bg-indigo-50 text-indigo-600';
                            iconClass = 'fa-user-tie';
                            itemTheme = { bg: 'bg-indigo-50', text: 'text-indigo-600', hoverBg: 'hover:bg-indigo-600' };
                        }

                        finalHtml += `
                            <div class="bg-white rounded-3xl p-5 app-card-shadow border border-slate-100 space-y-4">
                                <div class="flex items-center justify-between pb-1 border-b border-slate-50">
                                    <div>
                                        <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">${currentMode === 'divisi' ? 'Divisi Pengurus' : 'Unit Lembaga'}</span>
                                        <h2 class="text-base font-extrabold text-slate-900">${groupName}</h2>
                                    </div>
                                    <span class="text-[10px] font-bold ${badgeColor} px-2.5 py-1 rounded-full flex items-center gap-1">
                                        <i class="fa-solid ${iconClass}"></i> ${groupName}
                                    </span>
                                </div>

                                <div class="grid grid-cols-4 gap-y-5 gap-x-2 text-center pt-2">
                        `;

                        items.forEach((menuItem) => {
                            finalHtml += `
                                <a href="${menuItem.link}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center group">
                                    <div class="w-12 h-12 rounded-2xl ${itemTheme.bg} ${itemTheme.text} group-hover:${itemTheme.hoverBg} group-hover:text-white transition flex items-center justify-center text-lg mb-1.5 shadow-sm relative">
                                        <i class="fa-solid ${iconClass}"></i>
                                    </div>
                                    <span class="text-[11px] font-bold text-slate-700 leading-tight line-clamp-2">${menuItem.nama}</span>
                                    ${menuItem.subInfo && menuItem.subInfo !== 'Yayasan / Umum' && menuItem.subInfo !== 'Umum' ? `<span class="text-[9px] font-semibold text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded mt-1">${menuItem.subInfo}</span>` : ''}
                                </a>
                            `;
                        });

                        finalHtml += `
                                </div>
                            </div>
                        `;
                    }

                    container.innerHTML = finalHtml;
                } else {
                    container.innerHTML = `<div class="bg-white rounded-3xl p-5 text-center text-xs text-slate-400 py-6">Belum ada menu yang diatur.</div>`;
                }
            } else {
                container.innerHTML = `<div class="bg-white rounded-3xl p-5 text-center text-xs text-slate-400 py-6">Data menu kosong.</div>`;
            }
        }

        window.addEventListener('load', () => {
            loadRuangKerjaMenu();
        });
    </script>

</body>
</html>
